name: Bug report
description: The quiz, result page, or local setup does not behave as it should
title: "[Bug]: "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python app.py
        2. Open http://127.0.0.1:5001
        3. Answer the quiz with ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and browser if the bug is visual.
      placeholder: Python 3.12, macOS, Chrome
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find this bug.
        - label: This is not a security vulnerability. Security reports go to the contact in SECURITY.md.
